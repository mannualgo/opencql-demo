[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencql-dsl"
version = "0.3.0"
description = "SQL-like DSL for LLM context engineering"
requires-python = ">=3.9"
dependencies = [
    "lark>=1.1",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["opencql_dsl*"]

[tool.setuptools.package-data]
opencql_dsl = ["*.lark"]
